name: Build Arch Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Publish Repo
        uses: Jguer/Arch-Repo-Action@v1
        with:
          repo-name: 'myrepo'
